[project]
name = "kpekpe-learnia"
version = "0.1.0"
description = "Plateforme intelligente d'orientation éducative et professionnelle"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.1,<5.2",
    "django-configurations>=2.5",
    "gunicorn>=23.0",
    "psycopg2-binary>=2.9",
    "dj-database-url>=2.3",
    "django-model-utils>=5.0",
    "django_unique_upload>=0.2.1",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "django-storages>=1.14",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "ipdb>=0.13",
    "ipython>=8.30",
    "mkdocs>=1.6",
    "ruff>=0.8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "mock>=5.1",
    "coverage>=7.6",
]

[tool.ruff]
line-length = 110
target-version = "py313"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "DJ"]
ignore = ["E501"]